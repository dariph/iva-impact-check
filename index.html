<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IVA-Impact Check™ | Simulador de Margem IBS & CBS 2027</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom": "https://esm.sh/react-dom@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
          "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react,react-dom",
          "clsx": "https://esm.sh/clsx@2.1.1",
          "tailwind-merge": "https://esm.sh/tailwind-merge@2.3.0"
        }
      }
    </script>
  </head>
  <body
    class="bg-slate-100/70 text-slate-900 antialiased selection:bg-blue-600 selection:text-white"
  >
    <div id="root" class="w-full min-w-0"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useMemo } from "react";
      import { createRoot } from "react-dom/client";
      import {
        BarChart,
        Bar,
        XAxis,
        YAxis,
        Tooltip,
        ResponsiveContainer,
      } from "recharts";
      import {
        Calculator,
        Check,
        AlertTriangle,
        TrendingUp,
        ShieldCheck,
        Sparkles,
        Layers,
        DollarSign,
        PieChart,
        Copy,
        Info,
        Sun,
        Moon,
      } from "lucide-react";

      const SECTOR_PROFILES = {
        simplesPequeno: {
          label: "Micro/Pequena Empresa (Simples Tradicional)",
          regime: "simples_puro",
          precoAtual: 15000,
          custoInsumos: 0,
          despesasOperacionais: 0,
          aliquotaSimplesDas: 8.5,
          fatiaIvaDas: 45,
          icms: 0,
          iss: 0,
          pisCofins: 0,
          creditoInsumosAntigo: 0,
          reducaoIva: 0,
          descricao:
            "Mantém o DAS único. Não se credita na entrada e transfere crédito muito reduzido ao adquirente PJ.",
        },
        simplesB2B: {
          label: "Simples Nacional B2B (Opção Híbrida IBS/CBS)",
          regime: "simples_hibrido",
          precoAtual: 30000,
          custoInsumos: 0,
          despesasOperacionais: 0,
          aliquotaSimplesDas: 8.5,
          fatiaIvaDas: 45,
          icms: 0,
          iss: 0,
          pisCofins: 0,
          creditoInsumosAntigo: 0,
          reducaoIva: 0,
          descricao:
            "Permanece no DAS para IRPJ/CSLL/CPP e recolhe IBS/CBS por fora, transferindo crédito pleno para clientes PJ.",
        },
        locacaoImoveis: {
          label: "Locação de Imóveis (Redutor 70%)",
          regime: "presumido",
          precoAtual: 20000,
          custoInsumos: 0,
          despesasOperacionais: 0,
          aliquotaSimplesDas: 0,
          fatiaIvaDas: 0,
          icms: 0,
          iss: 0,
          pisCofins: 3.65,
          creditoInsumosAntigo: 0,
          reducaoIva: 70,
          descricao:
            "Locação de bens imóveis contemplada com redução de 70% nas alíquotas de IBS e CBS (PLP 68/2024).",
        },
        servicos: {
          label: "Prestador de Serviços (Presumido)",
          regime: "presumido",
          precoAtual: 10000,
          custoInsumos: 0,
          despesasOperacionais: 0,
          aliquotaSimplesDas: 0,
          fatiaIvaDas: 0,
          icms: 0,
          iss: 5.0,
          pisCofins: 3.65,
          creditoInsumosAntigo: 0,
          reducaoIva: 0,
          descricao:
            "Geralmente sofre com aumento de alíquota nominal devido à baixa apropriação de insumos tradicionais.",
        },
        comercio: {
          label: "Comércio Varejista / Atacadista (Real)",
          regime: "real",
          precoAtual: 50000,
          custoInsumos: 0,
          despesasOperacionais: 0,
          aliquotaSimplesDas: 0,
          fatiaIvaDas: 0,
          icms: 18.0,
          iss: 0,
          pisCofins: 9.25,
          creditoInsumosAntigo: 27.25,
          reducaoIva: 0,
          descricao:
            "Alto volume de créditos. A tributação por fora e fim da cumulatividade sobre energia/frete geram grande alívio.",
        },
      };

      const formatBRL = (val) => {
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
          maximumFractionDigits: 2,
        }).format(Number(val) || 0);
      };

      const formatPercent = (val) => {
        return (Number(val) || 0).toFixed(2).replace(".", ",") + "%";
      };

      function App() {
        const [isDark, setIsDark] = useState(() => {
          try {
            const savedTheme = localStorage.getItem("iva_impact_theme");
            if (savedTheme !== null) {
              return savedTheme === "dark";
            }
            return (
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            );
          } catch {
            return false;
          }
        });
        const [cenarioTipo, setCenarioTipo] = useState("teste2027");
        const [perfilSelecionado, setPerfilSelecionado] =
          useState("simplesB2B");
        const [aliquotaIvaPadrao, setAliquotaIvaPadrao] = useState(26.5);
        const [reducaoAliquota, setReducaoAliquota] = useState(0);
        const [aliquotaTesteCBS, setAliquotaTesteCBS] = useState(8.8);
        const [aliquotaTesteIBS, setAliquotaTesteIBS] = useState(0.1);

        const [precoAtual, setPrecoAtual] = useState(30000);
        const [custoInsumos, setCustoInsumos] = useState(12000);
        const [despesasOperacionais, setDespesasOperacionais] = useState(4000);
        const [regimeAtual, setRegimeAtual] = useState("simples_hibrido");

        const [aliquotaSimplesDas, setAliquotaSimplesDas] = useState(8.5);
        const [fatiaIvaDas, setFatiaIvaDas] = useState(45);

        const [aliquotaICMS, setAliquotaICMS] = useState(0);
        const [aliquotaISS, setAliquotaISS] = useState(5.0);
        const [aliquotaPisCofins, setAliquotaPisCofins] = useState(3.65);
        const [aproveitamentoCreditoNovo, setAproveitamentoCreditoNovo] =
          useState(90);

        const [copySuccess, setCopySuccess] = useState(false);
        const [activeTab, setActiveTab] = useState("simulador");

        useEffect(() => {
          try {
            const savedData = localStorage.getItem("iva_impact_check_v3");
            if (savedData) {
              const parsed = JSON.parse(savedData);
              setPrecoAtual(parsed.precoAtual ?? 30000);
              setCustoInsumos(parsed.custoInsumos ?? 12000);
              setDespesasOperacionais(parsed.despesasOperacionais ?? 4000);
              setRegimeAtual(parsed.regimeAtual ?? "simples_hibrido");
              setAliquotaSimplesDas(parsed.aliquotaSimplesDas ?? 8.5);
              setFatiaIvaDas(parsed.fatiaIvaDas ?? 45);
              setAliquotaICMS(parsed.aliquotaICMS ?? 0);
              setAliquotaISS(parsed.aliquotaISS ?? 5.0);
              setAliquotaPisCofins(parsed.aliquotaPisCofins ?? 3.65);
              setAliquotaIvaPadrao(parsed.aliquotaIvaPadrao ?? 26.5);
              setReducaoAliquota(parsed.reducaoAliquota ?? 0);
              setCenarioTipo(parsed.cenarioTipo ?? "teste2027");
              setAliquotaTesteCBS(parsed.aliquotaTesteCBS ?? 8.8);
              setAliquotaTesteIBS(parsed.aliquotaTesteIBS ?? 0.1);
              setPerfilSelecionado(parsed.perfilSelecionado ?? "simplesB2B");
            }
          } catch (err) {
            console.warn(err);
          }
        }, []);

        useEffect(() => {
          try {
            const toSave = {
              precoAtual,
              custoInsumos,
              despesasOperacionais,
              regimeAtual,
              aliquotaSimplesDas,
              fatiaIvaDas,
              aliquotaICMS,
              aliquotaISS,
              aliquotaPisCofins,
              aliquotaIvaPadrao,
              reducaoAliquota,
              cenarioTipo,
              aliquotaTesteCBS,
              aliquotaTesteIBS,
              perfilSelecionado,
            };
            localStorage.setItem("iva_impact_check_v3", JSON.stringify(toSave));
          } catch (err) {
            console.warn(err);
          }
        }, [
          precoAtual,
          custoInsumos,
          despesasOperacionais,
          regimeAtual,
          aliquotaSimplesDas,
          fatiaIvaDas,
          aliquotaICMS,
          aliquotaISS,
          aliquotaPisCofins,
          aliquotaIvaPadrao,
          reducaoAliquota,
          cenarioTipo,
          aliquotaTesteCBS,
          aliquotaTesteIBS,
          perfilSelecionado,
        ]);

        useEffect(() => {
          try {
            localStorage.setItem("iva_impact_theme", isDark ? "dark" : "light");
          } catch (err) {
            console.warn(err);
          }
        }, [isDark]);

        const handleSelectProfile = (key) => {
          setPerfilSelecionado(key);
          const p = SECTOR_PROFILES[key];
          if (!p) return;
          setPrecoAtual(p.precoAtual);
          setCustoInsumos(p.custoInsumos);
          setDespesasOperacionais(p.despesasOperacionais);
          setRegimeAtual(p.regime);
          setAliquotaSimplesDas(p.aliquotaSimplesDas || 8.5);
          setFatiaIvaDas(p.fatiaIvaDas || 45);
          setAliquotaICMS(p.icms);
          setAliquotaISS(p.iss);
          setAliquotaPisCofins(p.pisCofins);
          setReducaoAliquota(p.reducaoIva);
        };

        const calculation = useMemo(() => {
          let impostoVendaAtual = 0;
          let creditosAtuais = 0;

          if (
            regimeAtual === "simples_puro" ||
            regimeAtual === "simples_hibrido"
          ) {
            impostoVendaAtual = precoAtual * (aliquotaSimplesDas / 100);
            creditosAtuais = 0;
          } else {
            const aliquotaTotalAtualNominal =
              (Number(aliquotaICMS) +
                Number(aliquotaISS) +
                Number(aliquotaPisCofins)) /
              100;
            impostoVendaAtual = precoAtual * aliquotaTotalAtualNominal;

            if (regimeAtual === "real") {
              const aliqCredito = (Number(aliquotaICMS) + 9.25) / 100;
              creditosAtuais = custoInsumos * aliqCredito;
            } else {
              creditosAtuais = 0;
            }
          }

          const impostoLiquidoAtual = Math.max(
            0,
            impostoVendaAtual - creditosAtuais,
          );
          const receitaLiquidaAtual = precoAtual - impostoVendaAtual;
          const lucroMargemAtual =
            receitaLiquidaAtual -
            custoInsumos -
            despesasOperacionais +
            creditosAtuais;
          const margemPercentualAtual =
            precoAtual > 0 ? (lucroMargemAtual / precoAtual) * 100 : 0;

          const fatorReducao = 1 - reducaoAliquota / 100;

          let aliqCbsPercent = 0;
          let aliqIbsPercent = 0;

          if (cenarioTipo === "teste2027") {
            aliqCbsPercent = Number(aliquotaTesteCBS) * fatorReducao;
            aliqIbsPercent = Number(aliquotaTesteIBS) * fatorReducao;
          } else {
            const proporcaoCbs = 8.8 / 26.5;
            const aliquotaTotalComReducao = aliquotaIvaPadrao * fatorReducao;
            aliqCbsPercent = aliquotaTotalComReducao * proporcaoCbs;
            aliqIbsPercent = aliquotaTotalComReducao * (1 - proporcaoCbs);
          }

          const aliquotaIvaEfetivaPercent = aliqCbsPercent + aliqIbsPercent;
          const aliqIvaDecimal = aliquotaIvaEfetivaPercent / 100;
          const aliqCbsDecimal = aliqCbsPercent / 100;
          const aliqIbsDecimal = aliqIbsPercent / 100;

          const debitoCbsNominal = precoAtual * aliqCbsDecimal;
          const debitoIbsNominal = precoAtual * aliqIbsDecimal;
          const debitoIvaBruto = debitoCbsNominal + debitoIbsNominal;

          const baseDespesasComCredito =
            despesasOperacionais * (aproveitamentoCreditoNovo / 100);

          let creditosIvaInsumos = 0;
          let creditosIvaDespesas = 0;
          let totalCreditosNovos = 0;
          let impostoLiquidoIva = 0;
          let tributoRestanteDas = 0;
          let totalTributosNovoModelo = 0;
          let creditoTransferidoCliente = 0;

          if (regimeAtual === "simples_puro") {
            totalCreditosNovos = 0;
            creditosIvaInsumos = 0;
            creditosIvaDespesas = 0;
            tributoRestanteDas = precoAtual * (aliquotaSimplesDas / 100);
            totalTributosNovoModelo = tributoRestanteDas;

            const parcelaIvaNoDas =
              (aliquotaSimplesDas * (fatiaIvaDas / 100)) / 100;
            creditoTransferidoCliente = precoAtual * parcelaIvaNoDas;
          } else if (regimeAtual === "simples_hibrido") {
            const aliquotaDasReduzida =
              (aliquotaSimplesDas * (1 - fatiaIvaDas / 100)) / 100;
            tributoRestanteDas = precoAtual * aliquotaDasReduzida;

            creditosIvaInsumos = custoInsumos * aliqIvaDecimal;
            creditosIvaDespesas = baseDespesasComCredito * aliqIvaDecimal;
            totalCreditosNovos = creditosIvaInsumos + creditosIvaDespesas;

            impostoLiquidoIva = Math.max(
              0,
              debitoIvaBruto - totalCreditosNovos,
            );
            totalTributosNovoModelo = tributoRestanteDas + impostoLiquidoIva;
            creditoTransferidoCliente = debitoIvaBruto;
          } else {
            creditosIvaInsumos = custoInsumos * aliqIvaDecimal;
            creditosIvaDespesas = baseDespesasComCredito * aliqIvaDecimal;
            totalCreditosNovos = creditosIvaInsumos + creditosIvaDespesas;

            impostoLiquidoIva = Math.max(
              0,
              debitoIvaBruto - totalCreditosNovos,
            );
            tributoRestanteDas = 0;
            totalTributosNovoModelo = impostoLiquidoIva;
            creditoTransferidoCliente = debitoIvaBruto;
          }

          const saldoCredorIva = Math.max(
            0,
            totalCreditosNovos - debitoIvaBruto,
          );

          let lucroNovoMesmoPreco =
            precoAtual -
            totalTributosNovoModelo -
            custoInsumos -
            despesasOperacionais;
          const margemPercentualNovaMesmoPreco =
            precoAtual > 0 ? (lucroNovoMesmoPreco / precoAtual) * 100 : 0;

          let precoNecessarioNovo = precoAtual;
          if (regimeAtual === "simples_puro") {
            precoNecessarioNovo = precoAtual;
          } else {
            const baseNecessaria = Math.max(
              0,
              lucroMargemAtual +
                custoInsumos +
                despesasOperacionais +
                tributoRestanteDas -
                totalCreditosNovos,
            );
            precoNecessarioNovo =
              baseNecessaria + baseNecessaria * aliqIvaDecimal;
          }

          const variacaoPrecoPercent =
            precoAtual > 0
              ? ((precoNecessarioNovo - precoAtual) / precoAtual) * 100
              : 0;
          const cargaEfetivaAtual =
            precoAtual > 0 ? (impostoLiquidoAtual / precoAtual) * 100 : 0;
          const cargaEfetivaNova =
            precoAtual > 0 ? (totalTributosNovoModelo / precoAtual) * 100 : 0;

          return {
            impostoVendaAtual,
            creditosAtuais,
            impostoLiquidoAtual,
            receitaLiquidaAtual,
            lucroMargemAtual,
            margemPercentualAtual,
            aliqCbsPercent,
            aliqIbsPercent,
            debitoCbsNominal,
            debitoIbsNominal,
            aliquotaIvaEfetivaPercent,
            debitoIvaBruto,
            creditosIvaInsumos,
            creditosIvaDespesas,
            totalCreditosNovos,
            impostoLiquidoIva,
            tributoRestanteDas,
            totalTributosNovoModelo,
            saldoCredorIva,
            creditoTransferidoCliente,
            lucroNovoMesmoPreco,
            margemPercentualNovaMesmoPreco,
            precoNecessarioNovo,
            variacaoPrecoPercent,
            cargaEfetivaAtual,
            cargaEfetivaNova,
            diferencaLucroMesmoPreco: lucroNovoMesmoPreco - lucroMargemAtual,
          };
        }, [
          precoAtual,
          custoInsumos,
          despesasOperacionais,
          regimeAtual,
          aliquotaSimplesDas,
          fatiaIvaDas,
          aliquotaICMS,
          aliquotaISS,
          aliquotaPisCofins,
          cenarioTipo,
          aliquotaIvaPadrao,
          reducaoAliquota,
          aliquotaTesteCBS,
          aliquotaTesteIBS,
          aproveitamentoCreditoNovo,
        ]);

        const chartData = [
          {
            categoria: "Modelo Atual",
            TributosLiquidos: Math.round(calculation.impostoLiquidoAtual),
            CustosDespesas: Math.round(
              custoInsumos + despesasOperacionais - calculation.creditosAtuais,
            ),
            MargemLucro: Math.max(0, Math.round(calculation.lucroMargemAtual)),
          },
          {
            categoria: regimeAtual.startsWith("simples")
              ? `Simples (${regimeAtual === "simples_hibrido" ? "Híbrido" : "Puro"})`
              : "IBS/CBS",
            TributosLiquidos: Math.round(calculation.totalTributosNovoModelo),
            CustosDespesas: Math.round(
              custoInsumos +
                despesasOperacionais -
                calculation.totalCreditosNovos,
            ),
            MargemLucro: Math.max(
              0,
              Math.round(calculation.lucroNovoMesmoPreco),
            ),
          },
        ];

        const handleCopyReport = () => {
          const regimeNome = {
            simples_puro: "Simples Nacional Puro (Tradicional no DAS)",
            simples_hibrido:
              "Simples Nacional Híbrido (IBS/CBS apurado por fora)",
            presumido: "Lucro Presumido",
            real: "Lucro Real",
          }[regimeAtual];

          const texto = `=== RELATÓRIO TÉCNICO: IMPACTO REFORMA TRIBUTÁRIA 2027 ===
Perfil / Setor: ${SECTOR_PROFILES[perfilSelecionado]?.label || "Personalizado"}
Regime Tributário Selecionado: ${regimeNome}
Cenário Avaliado: ${cenarioTipo === "teste2027" ? `Janeiro/2027 (CBS ${calculation.aliqCbsPercent.toFixed(2)}% + IBS ${calculation.aliqIbsPercent.toFixed(2)}%)` : `IVA Dual Pleno (${calculation.aliquotaIvaEfetivaPercent.toFixed(2)}%)`}

1. FATURAMENTO E PRECIFICAÇÃO:
- Preço Atual de Venda: ${formatBRL(precoAtual)}
- Preço Sugerido para Preservar Lucro: ${formatBRL(calculation.precoNecessarioNovo)} (${calculation.variacaoPrecoPercent >= 0 ? "+" : ""}${calculation.variacaoPrecoPercent.toFixed(2)}%)
- Carga Tributária Efetiva: de ${formatPercent(calculation.cargaEfetivaAtual)} para ${formatPercent(calculation.cargaEfetivaNova)}

2. SISTEMÁTICA DE CRÉDITOS & ABATIMENTO:
- Débito CBS (${calculation.aliqCbsPercent.toFixed(2)}%): ${formatBRL(calculation.debitoCbsNominal)}
- Débito IBS (${calculation.aliqIbsPercent.toFixed(2)}%): ${formatBRL(calculation.debitoIbsNominal)}
- Total Débito IBS/CBS: ${formatBRL(calculation.debitoIvaBruto)}
- Créditos de Insumos Diretos: ${formatBRL(calculation.creditosIvaInsumos)}
- Créditos de Despesas Operacionais: ${formatBRL(calculation.creditosIvaDespesas)}
- Total de Créditos Abatidos: ${formatBRL(calculation.totalCreditosNovos)}
- Imposto Líquido IBS/CBS a Recolher: ${formatBRL(calculation.impostoLiquidoIva)}
${regimeAtual === "simples_hibrido" ? `- Parcela Residual do DAS (IRPJ/CSLL/CPP): ${formatBRL(calculation.tributoRestanteDas)}` : ""}

3. IMPACTO COMERCIAL B2B:
- Crédito Fiscal Transferido para o Cliente PJ: ${formatBRL(calculation.creditoTransferidoCliente)}
- Margem de Lucro Operacional: de ${formatBRL(calculation.lucroMargemAtual)} para ${formatBRL(calculation.lucroNovoMesmoPreco)} (${calculation.diferencaLucroMesmoPreco >= 0 ? "+" : ""}${formatBRL(calculation.diferencaLucroMesmoPreco)})

Gerado via IVA-Impact Check™ • Desenvolvido por Dari Pinheiro Heirich`;

          const textarea = document.createElement("textarea");
          textarea.value = texto;
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand("copy");
            setCopySuccess(true);
            setTimeout(() => setCopySuccess(false), 3000);
          } catch (e) {
            console.error(e);
          }
          document.body.removeChild(textarea);
        };

        return (
          <div
            className={`w-full h-auto border rounded-2xl shadow-xl overflow-hidden font-sans my-4 transition-colors duration-200 ${
              isDark
                ? "bg-slate-950 text-slate-100 border-slate-800"
                : "bg-slate-50/60 text-slate-900 border-slate-200/90"
            }`}
          >
            <header
              className={`p-5 sm:p-7 relative border-b transition-colors duration-200 ${
                isDark
                  ? "bg-slate-900 border-slate-800"
                  : "bg-white border-slate-200"
              }`}
            >
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                  <div
                    className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider mb-2 border ${
                      isDark
                        ? "bg-blue-950/60 border-blue-800 text-blue-300"
                        : "bg-blue-50 border-blue-200/70 text-blue-700"
                    }`}
                  >
                    <Sparkles className="w-3.5 h-3.5 text-blue-500" />
                    Reforma Tributária • EC 132/2023 & Marco 01/2027
                  </div>
                  <h1
                    className={`text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2 ${
                      isDark ? "text-white" : "text-slate-900"
                    }`}
                  >
                    IVA-Impact Check<span className="text-blue-500">™</span>
                  </h1>
                  <p
                    className={`text-xs sm:text-sm max-w-2xl mt-1 leading-relaxed ${
                      isDark ? "text-slate-400" : "text-slate-600"
                    }`}
                  >
                    Simulador Especializado de IBS & CBS: Simples Nacional (Puro
                    vs. Híbrido), Abatimento de Créditos Fiscais e Preservação
                    de Margem.
                  </p>
                </div>

                <div className="flex items-center gap-2.5 self-start md:self-auto">
                  <button
                    type="button"
                    onClick={() => setIsDark(!isDark)}
                    title={isDark ? "Ativar Modo Claro" : "Ativar Modo Escuro"}
                    className={`flex items-center gap-2 px-3.5 py-2.5 rounded-xl border text-xs font-bold transition-all duration-200 active:scale-95 cursor-pointer shadow-sm ${
                      isDark
                        ? "bg-slate-800 hover:bg-slate-700 text-amber-300 border-slate-700 hover:text-amber-200"
                        : "bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300/80 hover:text-slate-900"
                    }`}
                  >
                    {isDark ? (
                      <Sun className="w-4 h-4 text-amber-400" />
                    ) : (
