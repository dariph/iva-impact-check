      const SECTOR_PROFILES = {

      const formatBRL = (val) => {
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
          maximumFractionDigits: 2,
        }).format(Number(val) || 0);
      };

      const formatPercent = (val) => {
        return (Number(val) || 0).toFixed(2).replace(".", ",") + "%";
      };

      function App() {
        const [isDark, setIsDark] = useState(() => {
          try {
            const savedTheme = localStorage.getItem("iva_impact_theme");
            if (savedTheme !== null) {
              return savedTheme === "dark";
            }
            return (
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            );
          } catch {
            return false;
          }
        });

        const [cenarioTipo, setCenarioTipo] = useState("teste2027");
        const [perfilSelecionado, setPerfilSelecionado] =
          useState("locacaoResidencial");
        const [aliquotaIvaPadrao, setAliquotaIvaPadrao] = useState(26.5);
        const [reducaoAliquota, setReducaoAliquota] = useState(70);
        const [aliquotaTesteCBS, setAliquotaTesteCBS] = useState(8.8);
        const [aliquotaTesteIBS, setAliquotaTesteIBS] = useState(0.1);

        const [precoAtual, setPrecoAtual] = useState(10000);
        const [custoInsumos, setCustoInsumos] = useState(0);
        const [despesasOperacionais, setDespesasOperacionais] = useState(600);
        const [regimeAtual, setRegimeAtual] = useState("presumido");

        const [aliquotaSimplesDas, setAliquotaSimplesDas] = useState(8.5);
        const [fatiaIvaDas, setFatiaIvaDas] = useState(45);

        const [aliquotaICMS, setAliquotaICMS] = useState(0);
        const [aliquotaISS, setAliquotaISS] = useState(0);
        const [aliquotaPisCofins, setAliquotaPisCofins] = useState(3.65);
        const [aproveitamentoCreditoNovo, setAproveitamentoCreditoNovo] =
          useState(90);

        const [isImobiliario, setIsImobiliario] = useState(true);
        const [tipoLocacao, setTipoLocacao] = useState("residencial");
        const [deducaoCondominioIptu, setDeducaoCondominioIptu] =
          useState(1200);
        const [qtdImoveisResidenciais, setQtdImoveisResidenciais] = useState(2);
        const [opcaoArt487, setOpcaoArt487] = useState(false);

        const [copySuccess, setCopySuccess] = useState(false);
        const [activeTab, setActiveTab] = useState("simulador");
        const [showScrollTop, setShowScrollTop] = useState(false);

        useEffect(() => {
          const handleScroll = () => {
            if (window.scrollY > 300) {
              setShowScrollTop(true);
            } else {
              setShowScrollTop(false);
            }
          };
          window.addEventListener("scroll", handleScroll);
          return () => window.removeEventListener("scroll", handleScroll);
        }, []);

        const scrollToTop = () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const handleReset = () => {
          try {
            localStorage.removeItem("iva_impact_check_v4");
          } catch (e) {
            console.warn(e);
          }
          setPerfilSelecionado("locacaoResidencial");
          setCenarioTipo("teste2027");
          setAliquotaIvaPadrao(26.5);
          setReducaoAliquota(70);
          setAliquotaTesteCBS(8.8);
          setAliquotaTesteIBS(0.1);
          setPrecoAtual(10000);
          setCustoInsumos(0);
          setDespesasOperacionais(600);
          setRegimeAtual("presumido");
          setAliquotaSimplesDas(8.5);
          setFatiaIvaDas(45);
          setAliquotaICMS(0);
          setAliquotaISS(0);
          setAliquotaPisCofins(3.65);
          setAproveitamentoCreditoNovo(90);
          setIsImobiliario(true);
          setTipoLocacao("residencial");
          setDeducaoCondominioIptu(1200);
          setQtdImoveisResidenciais(2);
          setOpcaoArt487(false);
          setActiveTab("simulador");
        };

        useEffect(() => {
          try {
            const savedData = localStorage.getItem("iva_impact_check_v4");
            if (savedData) {
              const p = JSON.parse(savedData);
              setPrecoAtual(p.precoAtual ?? 10000);
              setCustoInsumos(p.custoInsumos ?? 0);
              setDespesasOperacionais(p.despesasOperacionais ?? 600);
              setRegimeAtual(p.regimeAtual ?? "presumido");
              setAliquotaSimplesDas(p.aliquotaSimplesDas ?? 8.5);
              setFatiaIvaDas(p.fatiaIvaDas ?? 45);
              setAliquotaICMS(p.aliquotaICMS ?? 0);
              setAliquotaISS(p.aliquotaISS ?? 0);
              setAliquotaPisCofins(p.aliquotaPisCofins ?? 3.65);
              setAliquotaIvaPadrao(p.aliquotaIvaPadrao ?? 26.5);
              setReducaoAliquota(p.reducaoAliquota ?? 70);
              setCenarioTipo(p.cenarioTipo ?? "teste2027");
              setAliquotaTesteCBS(p.aliquotaTesteCBS ?? 8.8);
              setAliquotaTesteIBS(p.aliquotaTesteIBS ?? 0.1);
              setPerfilSelecionado(p.perfilSelecionado ?? "locacaoResidencial");
              setIsImobiliario(p.isImobiliario ?? true);
              setTipoLocacao(p.tipoLocacao ?? "residencial");
              setDeducaoCondominioIptu(p.deducaoCondominioIptu ?? 1200);
              setQtdImoveisResidenciais(p.qtdImoveisResidenciais ?? 2);
              setOpcaoArt487(p.opcaoArt487 ?? false);
            }
          } catch (err) {
            console.warn(err);
          }
        }, []);

        useEffect(() => {
          try {
            const toSave = {
              precoAtual,
              custoInsumos,
              despesasOperacionais,
              regimeAtual,
              aliquotaSimplesDas,
              fatiaIvaDas,
              aliquotaICMS,
              aliquotaISS,
              aliquotaPisCofins,
              aliquotaIvaPadrao,
              reducaoAliquota,
              cenarioTipo,
              aliquotaTesteCBS,
              aliquotaTesteIBS,
              perfilSelecionado,
              isImobiliario,
              tipoLocacao,
              deducaoCondominioIptu,
              qtdImoveisResidenciais,
              opcaoArt487,
            };
            localStorage.setItem("iva_impact_check_v4", JSON.stringify(toSave));
          } catch (err) {
            console.warn(err);
          }
        }, [
          precoAtual,
          custoInsumos,
          despesasOperacionais,
          regimeAtual,
          aliquotaSimplesDas,
          fatiaIvaDas,
          aliquotaICMS,
          aliquotaISS,
          aliquotaPisCofins,
          aliquotaIvaPadrao,
          reducaoAliquota,
          cenarioTipo,
          aliquotaTesteCBS,
          aliquotaTesteIBS,
          perfilSelecionado,
          isImobiliario,
          tipoLocacao,
          deducaoCondominioIptu,
          qtdImoveisResidenciais,
          opcaoArt487,
        ]);

        useEffect(() => {
          try {
            localStorage.setItem("iva_impact_theme", isDark ? "dark" : "light");
          } catch (err) {
            console.warn(err);
          }
        }, [isDark]);

        const handleSelectProfile = (key) => {
          setPerfilSelecionado(key);
          const p = SECTOR_PROFILES[key];
          if (!p) return;
          setPrecoAtual(p.precoAtual);
          setCustoInsumos(p.custoInsumos);
          setDespesasOperacionais(p.despesasOperacionais);
          setRegimeAtual(p.regime);
          setAliquotaSimplesDas(p.aliquotaSimplesDas || 8.5);
          setFatiaIvaDas(p.fatiaIvaDas || 45);
          setAliquotaICMS(p.icms);
          setAliquotaISS(p.iss);
          setAliquotaPisCofins(p.pisCofins);
          setReducaoAliquota(p.reducaoIva);
          setIsImobiliario(Boolean(p.isImobiliario));
          setTipoLocacao(p.tipoLocacao || "geral");
          setDeducaoCondominioIptu(p.deducaoCondominioIptu || 0);
          setQtdImoveisResidenciais(p.qtdImoveisResidenciais || 0);
          setOpcaoArt487(false);
        };

        const calculation = useMemo(() => {
          let impostoVendaAtual = 0;
          let creditosAtuais = 0;

          if (
            regimeAtual === "simples_puro" ||
            regimeAtual === "simples_hibrido"
          ) {
            impostoVendaAtual = precoAtual * (aliquotaSimplesDas / 100);
            creditosAtuais = 0;
          } else {
            const aliquotaTotalAtualNominal =
              (Number(aliquotaICMS) +
                Number(aliquotaISS) +
                Number(aliquotaPisCofins)) /
              100;
            impostoVendaAtual = precoAtual * aliquotaTotalAtualNominal;

            if (regimeAtual === "real") {
              const aliqCredito = (Number(aliquotaICMS) + 9.25) / 100;
              creditosAtuais = custoInsumos * aliqCredito;
            } else {
              creditosAtuais = 0;
            }
          }

          const impostoLiquidoAtual = Math.max(
            0,
            impostoVendaAtual - creditosAtuais,
          );
          const receitaLiquidaAtual = precoAtual - impostoVendaAtual;
          const lucroMargemAtual =
            receitaLiquidaAtual -
            custoInsumos -
            despesasOperacionais +
            creditosAtuais;
          const margemPercentualAtual =
            precoAtual > 0 ? (lucroMargemAtual / precoAtual) * 100 : 0;

          let baseCalculoIva = precoAtual;
          let deducaoIptuCondominioEfetiva = 0;
          let redutorSocialTotal = 0;

          if (isImobiliario && !opcaoArt487 && regimeAtual !== "simples_puro") {
            deducaoIptuCondominioEfetiva = Math.min(
              precoAtual,
              Number(deducaoCondominioIptu) || 0,
            );
            const baseAposExpurgos = Math.max(
              0,
              precoAtual - deducaoIptuCondominioEfetiva,
            );

            if (tipoLocacao === "residencial") {
              redutorSocialTotal = Math.min(
                baseAposExpurgos,
                (Number(qtdImoveisResidenciais) || 0) * 600,
              );
              baseCalculoIva = Math.max(
                0,
                baseAposExpurgos - redutorSocialTotal,
              );
            } else {
              redutorSocialTotal = 0;
              baseCalculoIva = baseAposExpurgos;
            }
          }

          const fatorReducao = 1 - reducaoAliquota / 100;
          let aliqCbsPercent = 0;
          let aliqIbsPercent = 0;

          if (opcaoArt487) {
            aliqCbsPercent = 3.65 * (8.8 / 8.9);
            aliqIbsPercent = 3.65 * (0.1 / 8.9);
            baseCalculoIva = precoAtual;
          } else if (cenarioTipo === "teste2027") {
            aliqCbsPercent = Number(aliquotaTesteCBS) * fatorReducao;
            aliqIbsPercent = Number(aliquotaTesteIBS) * fatorReducao;
          } else {
            const proporcaoCbs = 8.8 / 26.5;
            const aliquotaTotalComReducao = aliquotaIvaPadrao * fatorReducao;
            aliqCbsPercent = aliquotaTotalComReducao * proporcaoCbs;
            aliqIbsPercent = aliquotaTotalComReducao * (1 - proporcaoCbs);
          }

          const aliquotaIvaEfetivaPercent = opcaoArt487
            ? 3.65
            : aliqCbsPercent + aliqIbsPercent;
          const aliqIvaDecimal = aliquotaIvaEfetivaPercent / 100;
          const aliqCbsDecimal = aliqCbsPercent / 100;
          const aliqIbsDecimal = aliqIbsPercent / 100;

          const debitoCbsNominal = baseCalculoIva * aliqCbsDecimal;
          const debitoIbsNominal = baseCalculoIva * aliqIbsDecimal;
          const debitoIvaBruto = debitoCbsNominal + debitoIbsNominal;

          const baseDespesasComCredito =
            despesasOperacionais * (aproveitamentoCreditoNovo / 100);

          let creditosIvaInsumos = 0;
          let creditosIvaDespesas = 0;
          let totalCreditosNovos = 0;
          let impostoLiquidoIva = 0;
          let tributoRestanteDas = 0;
          let totalTributosNovoModelo = 0;
          let creditoTransferidoCliente = 0;

          const parcelaIvaNoDas =
            (aliquotaSimplesDas * (fatiaIvaDas / 100)) / 100;
          const creditoSimplesPuro = precoAtual * parcelaIvaNoDas;

          if (regimeAtual === "simples_puro") {
            totalCreditosNovos = 0;
            creditosIvaInsumos = 0;
            creditosIvaDespesas = 0;
            tributoRestanteDas = precoAtual * (aliquotaSimplesDas / 100);
            totalTributosNovoModelo = tributoRestanteDas;
            creditoTransferidoCliente = creditoSimplesPuro;
          } else if (regimeAtual === "simples_hibrido") {
            const aliquotaDasReduzida =
              (aliquotaSimplesDas * (1 - fatiaIvaDas / 100)) / 100;
            tributoRestanteDas = precoAtual * aliquotaDasReduzida;

            creditosIvaInsumos = custoInsumos * aliqIvaDecimal;
            creditosIvaDespesas = baseDespesasComCredito * aliqIvaDecimal;
            totalCreditosNovos = creditosIvaInsumos + creditosIvaDespesas;

            impostoLiquidoIva = Math.max(
              0,
              debitoIvaBruto - totalCreditosNovos,
            );
            totalTributosNovoModelo = tributoRestanteDas + impostoLiquidoIva;
            creditoTransferidoCliente = debitoIvaBruto;
          } else {
            if (opcaoArt487) {
              creditosIvaInsumos = 0;
              creditosIvaDespesas = 0;
              totalCreditosNovos = 0;
            } else {
              creditosIvaInsumos = custoInsumos * aliqIvaDecimal;
              creditosIvaDespesas = baseDespesasComCredito * aliqIvaDecimal;
              totalCreditosNovos = creditosIvaInsumos + creditosIvaDespesas;
            }

            impostoLiquidoIva = Math.max(
              0,
              debitoIvaBruto - totalCreditosNovos,
            );
            tributoRestanteDas = 0;
            totalTributosNovoModelo = impostoLiquidoIva;

            if (isImobiliario && tipoLocacao === "residencial") {
              creditoTransferidoCliente = 0;
            } else {
              creditoTransferidoCliente = debitoIvaBruto;
            }
          }

          let lucroNovoMesmoPreco =
            precoAtual -
            totalTributosNovoModelo -
            custoInsumos -
            despesasOperacionais;
          const margemPercentualNovaMesmoPreco =
            precoAtual > 0 ? (lucroNovoMesmoPreco / precoAtual) * 100 : 0;

          let precoNecessarioNovo = precoAtual;
          if (regimeAtual === "simples_puro") {
            precoNecessarioNovo = precoAtual;
          } else {
            const baseNecessaria = Math.max(
              0,
              lucroMargemAtual +
                custoInsumos +
                despesasOperacionais +
                tributoRestanteDas -
                totalCreditosNovos,
            );
            precoNecessarioNovo =
              baseNecessaria + baseNecessaria * aliqIvaDecimal;
          }

          const variacaoPrecoPercent =
            precoAtual > 0
              ? ((precoNecessarioNovo - precoAtual) / precoAtual) * 100
              : 0;
          const cargaEfetivaAtual =
            precoAtual > 0 ? (impostoLiquidoAtual / precoAtual) * 100 : 0;
          const cargaEfetivaNova =
            precoAtual > 0 ? (totalTributosNovoModelo / precoAtual) * 100 : 0;

          const alertaSimplesLocacaoPropria =
            isImobiliario &&
            (regimeAtual === "simples_puro" ||
              regimeAtual === "simples_hibrido");

          return {
            impostoVendaAtual,
            creditosAtuais,
            impostoLiquidoAtual,
            receitaLiquidaAtual,
            lucroMargemAtual,
            margemPercentualAtual,
            aliqCbsPercent,
            aliqIbsPercent,
            debitoCbsNominal,
            debitoIbsNominal,
            aliquotaIvaEfetivaPercent,
            baseCalculoIva,
            deducaoIptuCondominioEfetiva,
            redutorSocialTotal,
            debitoIvaBruto,
            creditosIvaInsumos,
            creditosIvaDespesas,
            totalCreditosNovos,
            impostoLiquidoIva,
            tributoRestanteDas,
            totalTributosNovoModelo,
            creditoSimplesPuro,
            creditoTransferidoCliente,
            lucroNovoMesmoPreco,
            margemPercentualNovaMesmoPreco,
            precoNecessarioNovo,
            variacaoPrecoPercent,
            cargaEfetivaAtual,
            cargaEfetivaNova,
            alertaSimplesLocacaoPropria,
            diferencaLucroMesmoPreco: lucroNovoMesmoPreco - lucroMargemAtual,
          };
        }, [
          precoAtual,
          custoInsumos,
          despesasOperacionais,
          regimeAtual,
          aliquotaSimplesDas,
          fatiaIvaDas,
          aliquotaICMS,
          aliquotaISS,
          aliquotaPisCofins,
          cenarioTipo,
          aliquotaIvaPadrao,
